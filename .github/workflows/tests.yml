name: Testes e cobertura

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coverage-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/front/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix src/main/front
      - name: Testar protecao da politica de cobertura
        run: python -m unittest discover -s scripts/tests -v
      - name: Verificar skills fixadas
        run: node scripts/verify_skills_lock.mjs
      - name: Impedir reducao dos limites e novas exclusoes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/check_coverage_policy.py --base-ref "$BASE_SHA"
          else
            python scripts/check_coverage_policy.py
          fi

  backend:
    needs: coverage-policy
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes e cobertura Java
        run: bash ./mvnw verify
      - name: Publicar relatorio JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: target/site/jacoco/
          if-no-files-found: ignore
      - name: Instalar diff-cover
        if: always() && github.event_name == 'pull_request'
        run: python -m pip install 'diff-cover>=9,<10'
      - name: Verificar linhas Java alteradas
        if: always() && github.event_name == 'pull_request' && hashFiles('target/site/jacoco/jacoco.xml') != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: diff-cover target/site/jacoco/jacoco.xml --compare-branch="origin/$BASE_REF" --fail-under=80

  frontend:
    needs: coverage-policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/main/front
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/main/front/package-lock.json
      - run: npm ci
      - name: Testes e cobertura React
        run: npm run test:coverage
      - name: Publicar relatorio do frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: src/main/front/coverage/
          if-no-files-found: ignore
      - name: Instalar diff-cover
        if: always() && github.event_name == 'pull_request'
        run: python -m pip install 'diff-cover>=9,<10'
      - name: Verificar linhas React alteradas
        if: always() && github.event_name == 'pull_request' && hashFiles('src/main/front/coverage/lcov.info') != ''
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          sed 's|^SF:|SF:src/main/front/|' src/main/front/coverage/lcov.info > /tmp/frontend-lcov.info
          diff-cover /tmp/frontend-lcov.info --compare-branch="origin/$BASE_REF" --fail-under=80
      - name: Compilar frontend
        if: always()
        run: npm run build
