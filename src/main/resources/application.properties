spring.application.name=gestao-acoes-corretoras

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:60m}
app.jwt.issuer=${JWT_ISSUER:gestao-acoes-corretoras}

# Chaves externas: configure pelo ambiente, nunca no controle de versao.
api.brapi.token=${BRAPI_TOKEN:}
api.alphavantage.key=${ALPHAVANTAGE_API_KEY:}

spring.cache.type=simple

# O Liquibase passa a ser o responsavel pela criacao e evolucao do banco.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# O Hibernate apenas confere se as entidades correspondem ao banco.
spring.jpa.hibernate.ddl-auto=validate
