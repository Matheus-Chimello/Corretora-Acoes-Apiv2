#conexao ao postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/acoes_corretoradb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

#define a forma de geração do banco de dados
spring.jpa.hibernate.ddl-auto=validate

# gera log
logging.file.name=acoes_corretora_dev.log
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

#exibe os SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.bootstrap.admin.username=${APP_ADMIN_USERNAME:admin@corretora.local}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD}
